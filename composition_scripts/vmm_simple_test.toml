[system]
description = "Simple VMM"
# Simple test to see linux VM boot and execute init.
# The guest is named by the vmm component's VM_GUEST_IMAGE constant below.

[[components]]
name = "booter"
img  = "no_interface.llbooter"
implements = [{interface = "init"}, {interface = "addr"}]
deps = [{srv = "kernel", interface = "init", variant = "kernel"}]
constructor = "kernel"

[[components]]
name = "capmgr"
img  = "capmgr.simple"
deps = [{srv = "booter", interface = "init"}, {srv = "booter", interface = "addr"}]
implements = [{interface = "capmgr"}, {interface = "init"}, {interface = "memmgr"}, {interface = "capmgr_create"}, {interface = "contigmem"}]
constructor = "booter"
baseaddr = "0x1000000"

[[components]]
name = "sched"
img  = "sched.pfprr_quantum_static"
deps = [{srv = "capmgr", interface = "init"}, {srv = "capmgr", interface = "capmgr"}, {srv = "capmgr", interface = "memmgr"}]
implements = [{interface = "sched"}, {interface = "syncipc"}, {interface = "init"}]
constructor = "booter"
baseaddr = "0x1600000"

[[components]]
name = "vmm"
img  = "simple_vmm.vmm"
# The guest to boot. Built on demand by the vmimg submodule if not already in
# simple_vmm/vmm/guest/. The value is substituted verbatim into a #define, so
# the quotes around the path must be escaped.
constants = [{variable = "VM_GUEST_IMAGE", value = "\"guest/vmlinux-shell-5.15.107.img\""}]
deps = [{srv = "sched", interface = "sched"}, {srv = "sched", interface = "init"},{srv = "capmgr", interface = "capmgr"}, {srv = "capmgr", interface = "memmgr"}, {srv = "capmgr", interface = "contigmem"}]
implements = []
constructor = "booter"
baseaddr = "0x2000000"
