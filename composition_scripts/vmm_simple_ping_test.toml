[system]
description = "Simple VMM Ping Test"
# VM <---[virtio]---> VMM <---[shared mem]---> nicmgr
# enable-nic flag must be given using QEMU. (./cos run [binary name] enable-nic)
# 
# The guest is the "ping" recipe: it brings up eth0 and pings a known address.
# tap0 could be configured and used as a receiving interface.

[[components]]
name = "booter"
img  = "no_interface.llbooter"
implements = [{interface = "init"}, {interface = "addr"}]
deps = [{srv = "kernel", interface = "init", variant = "kernel"}]
constructor = "kernel"

[[components]]
name = "capmgr"
img  = "capmgr.simple"
deps = [{srv = "booter", interface = "init"}, {srv = "booter", interface = "addr"}]
implements = [{interface = "capmgr"}, {interface = "init"}, {interface = "memmgr"}, {interface = "capmgr_create"}, {interface = "contigmem"}]
constructor = "booter"
baseaddr = "0x1000000"

[[components]]
name = "sched"
img  = "sched.pfprr_quantum_static"
deps = [{srv = "capmgr", interface = "init"}, {srv = "capmgr", interface = "capmgr"}, {srv = "capmgr", interface = "memmgr"}]
implements = [{interface = "sched"}, {interface = "syncipc"}, {interface = "init"}]
constructor = "booter"
baseaddr = "0x1600000"

[[components]]
name = "nicmgr"
img  = "nicmgr.dpdk"
# DPDK port to use. Machines enumerate NICs differently, so this is set per
# composition rather than compiled in; check the DEV_INFO lines in the boot log
# for the port_id of the NIC you want (see lib/dpdk/cos_dpdk.h).
constants = [{variable = "DPDK_NIC_PORT_RX", value = "0"}, {variable = "DPDK_NIC_PORT_TX", value = "0"}]
deps = [{srv = "sched", interface = "sched"}, {srv = "sched", interface = "init"}, {srv = "capmgr", interface = "capmgr_create"}, {srv = "capmgr", interface = "memmgr"}, {srv = "capmgr", interface = "contigmem"}]
implements = [{interface = "nic_netio_rx"}, {interface = "nic_netio_tx"}, {interface = "nic_netio_shmem"}]
constructor = "booter"
baseaddr = "0x6000000"

[[components]]
name = "vmm"
img  = "simple_vmm.vmm"
constants = [{variable = "VM_GUEST_IMAGE", value = "\"guest/vmlinux-ping-5.15.107.img\""}]
deps = [{srv = "sched", interface = "sched"}, {srv = "sched", interface = "init"},{srv = "capmgr", interface = "capmgr"}, {srv = "capmgr", interface = "memmgr"}, {srv = "capmgr", interface = "contigmem"}, {srv = "nicmgr", interface = "nic_netio_rx"}, {srv = "nicmgr", interface = "nic_netio_tx"}, {srv = "nicmgr", interface = "nic_netio_shmem"}]
implements = []
constructor = "booter"
baseaddr = "0x2000000"


